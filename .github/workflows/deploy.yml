name: Publicar desafio 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desafio-04/package-lock.json

      - name: Instalar dependências
        working-directory: desafio-04
        run: npm ci

      - name: Gerar build
        working-directory: desafio-04
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos de produção
        uses: actions/upload-pages-artifact@v4
        with:
          path: desafio-04/dist

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4