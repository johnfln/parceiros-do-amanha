<form>
    <fieldset>
        <legend>Cadastro de Clientes</legend>
        
        <p><label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Nome"></p>

        <p><label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="E-mail"></p>

        <p><label for="idade">Data de Nascimento:</label>
        <input type="date" id="idade" name="idade"></p>
    </fieldset>
    <p><button type="submit">Enviar dados</button></p>
</form>
